name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, feat/v35-foundation]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev-gate/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: npm ci --ignore-scripts --prefix dev-gate
      - name: JavaScript syntax and DEV guard tests
        run: npm run check --prefix dev-gate
      - name: Install SQL parser
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: SQL grammar
        run: python scripts/check_sql.py
      - name: Preserve V35 baseline and applied migrations
        run: python scripts/check_v35_preservation.py

  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: onboarding-ci
          POSTGRES_DB: onboarding_gate
        ports:
          - 55432:5432
        options: --health-cmd "pg_isready -U postgres -d onboarding_gate" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Onboarding handler
        run: node --test supabase/functions/onboarding-invite/dispatch.node-check.mjs
      - name: Onboarding PostgreSQL rollback and concurrency
        run: python3 scripts/check_onboarding_invite_pg.py

      - name: Cash flow PostgreSQL gate
        env:
          PGPASSWORD: onboarding-ci
        run: |
          createdb -h 127.0.0.1 -p 55432 -U postgres cash_flow_gate
          python3 scripts/check_cash_flow_pg.py

      - name: Commercial concurrency PostgreSQL gate
        env:
          PGPASSWORD: onboarding-ci
        run: |
          createdb -h 127.0.0.1 -p 55432 -U postgres commercial_concurrency_gate
          python3 scripts/check_commercial_concurrency_pg.py

      - name: Financial agreement, FIFO and reversal PostgreSQL gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: onboarding-ci
          PGDATABASE: financial_integrity_gate
        run: |
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
          python3 scripts/check_financial_agreement_fifo_reversal_pg.py --self-test-extract
          python3 scripts/check_financial_agreement_fifo_reversal_pg.py

      - name: Platform identity PostgreSQL gate
        env:
          PGPASSWORD: onboarding-ci
        run: |
          createdb -h 127.0.0.1 -p 55432 -U postgres platform_identity_gate
          python3 scripts/check_platform_identity_pg.py

      - name: Accounting books and DRE PostgreSQL gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: onboarding-ci
          PGDATABASE: accounting_books_gate
        run: |
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
          python3 scripts/check_accounting_books_pg.py --self-test-extract
          python3 scripts/check_accounting_books_pg.py

      - name: Master SaaS M04 lifecycle, billing and support PostgreSQL gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: onboarding-ci
          PGDATABASE: master_saas_m04_gate
        run: |
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
          python3 scripts/check_master_saas_m04_pg.py --self-test-extract
          python3 scripts/check_master_saas_m04_pg.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://szqkdekwhzxsoxorgvaz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate Cloudflare static bundle without uploading
        run: npx wrangler deploy --config wrangler.dev.jsonc --dry-run

  m05_privacy_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: onboarding-ci
          POSTGRES_DB: privacy_recovery_gate
        ports:
          - 55432:5432
        options: --health-cmd "pg_isready -U postgres -d privacy_recovery_gate" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: M05 backup runner hardening and manifest tests
        run: |
          chmod +x scripts/run_v35_m05_backup_restore_trial.sh
          bash scripts/test_v35_m05_runner_hardening.sh
          python3 scripts/v35_m05_backup_manifest.py --self-test
      - name: M05 privacy, retention, recovery & security PG17 gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: onboarding-ci
          PGDATABASE: privacy_recovery_gate
        run: |
          python3 scripts/check_privacy_recovery_pg.py --self-test-extract
          python3 scripts/check_privacy_recovery_pg.py
          psql -X -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -f scripts/v35_m05_single_tenant_recovery_check.sql
