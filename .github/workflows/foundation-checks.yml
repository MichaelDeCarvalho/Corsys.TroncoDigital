name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, feat/v35-foundation]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dev-gate/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: npm ci --ignore-scripts --prefix dev-gate
      - name: JavaScript syntax and DEV guard tests
        run: npm run check --prefix dev-gate
      - name: Install SQL parser
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: SQL grammar
        run: python scripts/check_sql.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://szqkdekwhzxsoxorgvaz.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Validate Cloudflare static bundle without uploading
        run: npx wrangler deploy --config wrangler.dev.jsonc --dry-run
